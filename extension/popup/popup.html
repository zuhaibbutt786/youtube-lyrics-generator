<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lyrics / Transcript</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h2 id="title">No result yet</h2>
    <div class="mode-toggle">
      <label>
        <input type="radio" name="mode" value="lyrics" checked> Lyrics Mode
      </label>
      <label>
        <input type="radio" name="mode" value="raw"> Raw Transcript
      </label>
    </div>
    <pre id="lyrics">Click “Get Lyrics / Transcript” on a YouTube video first.</pre>
    <div class="actions">
      <button id="copyBtn">Copy</button>
      <button id="downloadBtn">Download .txt</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
